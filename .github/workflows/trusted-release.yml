name: Build trusted release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Require artifact signing key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        shell: bash
        run: test -n "$RELEASE_GPG_PRIVATE_KEY"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - name: Build and notarize macOS packages
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_SIGNING_IDENTITY" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"
          npm run desktop:build -- --bundles app,dmg
          codesign --verify --deep --strict 'target/release/bundle/macos/Open Ledger.app'
          xcrun stapler validate 'target/release/bundle/macos/Open Ledger.app'
          spctl --assess --type execute 'target/release/bundle/macos/Open Ledger.app'
          mkdir -p artifacts
          cp target/release/bundle/dmg/*.dmg artifacts/
      - name: Build signed Windows installer
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:WINDOWS_CERTIFICATE) { throw 'Windows certificate is required' }
          $certificatePath = "$env:RUNNER_TEMP/release.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP/signing.json"
          npm run desktop:build -- --bundles nsis --config "$env:RUNNER_TEMP/signing.json"
          if ($LASTEXITCODE -ne 0) { throw 'Signed build failed' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw 'Invalid installer signature' }
            Copy-Item $_.FullName artifacts/
          }
          Remove-Item $certificatePath
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          npm run desktop:build -- --bundles deb,appimage
          mkdir -p artifacts
          cp target/release/bundle/deb/*.deb artifacts/
          cp target/release/bundle/appimage/*.AppImage artifacts/
      - run: node scripts/checksums.mjs artifacts
      - name: Sign artifact checksums
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        shell: bash
        run: |
          export GNUPGHOME="$RUNNER_TEMP/open-ledger-signing"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign artifacts/SHA256SUMS
          gpg --verify artifacts/SHA256SUMS.asc artifacts/SHA256SUMS
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v4
        with:
          name: trusted-candidate-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
