name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Optional successful package run ID to test installed packages without rebuilding
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed:
    if: inputs.package_run_id != ''
    uses: ./.github/workflows/native-packages.yml
    with:
      package_run_id: ${{ inputs.package_run_id }}
  build:
    if: inputs.package_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude open-ledger-desktop --locked
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Build native executable with bundled frontend
        run: npm run desktop:build -- --no-bundle -- --locked
      - name: Install native WebDriver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      - name: Linux native WebDriver dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y webkit2gtk-driver xvfb
      - name: Windows native WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $version = (Get-Item $edge).VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP/driver.zip"
          Expand-Archive "$env:RUNNER_TEMP/driver.zip" -DestinationPath "$env:RUNNER_TEMP/edgedriver"
          "$env:RUNNER_TEMP/edgedriver" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Native desktop smoke tests (Linux)
        if: runner.os == 'Linux'
        # Xvfb has no GPU. See https://v2.tauri.app/develop/debug/linux-graphics/
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a npm run test:desktop
      - name: Native desktop smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/native-windows.ps1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
