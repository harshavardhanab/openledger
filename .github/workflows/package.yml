name: Package desktop artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*-alpha*', 'v*-beta*', 'v*-rc*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - name: Build native packages
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Package macOS app with local signature
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - 'target/release/bundle/macos/Open Ledger.app'
          codesign --verify --deep --strict 'target/release/bundle/macos/Open Ledger.app'
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent 'target/release/bundle/macos/Open Ledger.app' 'artifacts/Open-Ledger-macos-${{ runner.arch }}.zip'
      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe artifacts/
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp target/release/bundle/deb/*.deb artifacts/
          cp target/release/bundle/appimage/*.AppImage artifacts/
      - name: Record package checksums
        run: node scripts/checksums.mjs artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: open-ledger-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
