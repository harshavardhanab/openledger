[workspace]
members = ["crates/ledger-core", "crates/ledger-store", "crates/ledger-server", "src-tauri"]
default-members = ["crates/ledger-core", "crates/ledger-store", "crates/ledger-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
